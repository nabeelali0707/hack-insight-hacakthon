# BijliCast source registry.
# Every raw file the pipeline fetches is declared here and recorded in manifest.csv
# (source, query/url, fetch time, SHA-256, licence).

ismo:
  publisher: "Independent System and Market Operator (ISMO), Government of Pakistan"
  landing_page: "https://www.ismo.gov.pk/dashboard"
  licence: >-
    Public information published on the ISMO dashboard "for general information and
    awareness purposes" (ISMO dashboard disclaimer). Attribution: ISMO. robots.txt allows all.
  # Files moved from ismo.gov.pk/admin/storage to cmsadmin.ismo.gov.pk/storage; the
  # fetcher rewrites old links to the new host.
  url_rewrite:
    from: "https://ismo.gov.pk/admin/storage/"
    to: "https://cmsadmin.ismo.gov.pk/storage/"

