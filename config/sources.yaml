open_meteo:
  publisher: "Open-Meteo.com (ERA5 / ERA5-Land reanalysis from Copernicus Climate Change Service, ECMWF; forecasts from national weather services)"
  licence: "CC BY 4.0 (Open-Meteo data); ERA5 under the Copernicus licence. Free non-commercial API, no key."
  archive_endpoint: "https://archive-api.open-meteo.com/v1/archive"
  forecast_endpoint: "https://api.open-meteo.com/v1/forecast"
  archive_start: "2022-01-01"
  # Pinned so `make data` rebuilds the same training data; live data comes from the forecast endpoint.
  archive_end: "2026-10-12"
  hourly_vars:
    - temperature_2m
    - relative_humidity_2m
    - dew_point_2m
    - apparent_temperature
    - precipitation
    - cloud_cover
    - wind_speed_10m
    - shortwave_radiation
  # One weather point per entity: the headquarters city of each distribution company.
  entities:
    KE:    {name: "K-Electric",                                  city: "Karachi",    province: "Sindh",        lat: 24.8607, lon: 67.0011}
    HESCO: {name: "Hyderabad Electric Supply Co.",               city: "Hyderabad",  province: "Sindh",        lat: 25.3960, lon: 68.3578}
    SEPCO: {name: "Sukkur Electric Power Co.",                   city: "Sukkur",     province: "Sindh",        lat: 27.7052, lon: 68.8574}
    LESCO: {name: "Lahore Electric Supply Co.",                  city: "Lahore",     province: "Punjab",       lat: 31.5204, lon: 74.3587}
    FESCO: {name: "Faisalabad Electric Supply Co.",              city: "Faisalabad", province: "Punjab",       lat: 31.4504, lon: 73.1350}
    GEPCO: {name: "Gujranwala Electric Power Co.",               city: "Gujranwala", province: "Punjab",       lat: 32.1877, lon: 74.1945}
    MEPCO: {name: "Multan Electric Power Co.",                   city: "Multan",     province: "Punjab",       lat: 30.1575, lon: 71.5249}
    IESCO: {name: "Islamabad Electric Supply Co.",               city: "Islamabad",  province: "ICT/Punjab",   lat: 33.6844, lon: 73.0479}
    PESCO: {name: "Peshawar Electric Supply Co.",                city: "Peshawar",   province: "Khyber Pakhtunkhwa", lat: 34.0151, lon: 71.5249}
    QESCO: {name: "Quetta Electric Supply Co.",                  city: "Quetta",     province: "Balochistan",  lat: 30.1798, lon: 66.9750}
